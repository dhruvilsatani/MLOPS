replicaCount: 2

app:
  name: ml-app

image:
  repository: dhruvilsatani/ml-app
  tag: 3d775481aa00ff6376e99451c1c7a5e21bcd38d0
  pullPolicy: Always

containerPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi

revisionHistoryLimit: 2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: ""

monitoring:
  enabled: true
  releaseLabel: monitoring
  namespace: monitoring
