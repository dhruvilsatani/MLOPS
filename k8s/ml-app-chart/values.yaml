    cpu: 250m
    memory: 512Mi

revisionHistoryLimit: 2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: ""

monitoring:
  enabled: true
  releaseLabel: monitoring
  namespace: monitoring
