name: CI/CD Pipeline
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "train.py"
      - "requirements-dev.txt"
      - "requirement-prod.txt"
      - "Dockerfile"
      - "static/**"
      - "tests/**"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "train.py"
      - "requirements-dev.txt"
      - "requirement-prod.txt"
      - "Dockerfile"
      - "static/**"
      - "tests/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 (syntax errors + undefined names only)
        run: flake8 . --select=E9,F --show-source

  test:
    name: Train & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Train model
        run: python train.py --no-tracking

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ml-app:latest
            ${{ secrets.DOCKER_USERNAME }}/ml-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm image tag
        run: |
          sed -i "0,/tag:.*/s//tag: ${{ github.sha }}/" k8s/ml-app-chart/values.yaml

      - name: Commit updated image tag
        run: |
          git config user.name "dhruvilsatani"
          git config user.email "dhruvilsatani98@gmail.com"
          git add k8s/ml-app-chart/values.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push




